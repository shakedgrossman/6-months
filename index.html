<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>6 Months of Us</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- Opening -->

    <section id="opening">

        <h1>6 months of us</h1>

        <button
            id="playButton"
            aria-label="Start"
        >
            ▶
        </button>

    </section>


    <!-- Timeline -->

    <main id="timeline">

        <button
            id="previousButton"
            class="nav-button previous"
            aria-label="Previous"
        >
            ‹
        </button>


        <div id="memory">

            <img
                id="memoryImage"
                src=""
                alt="Memory"
            >

            <video
                id="memoryVideo"
                controls
                playsinline
            ></video>


            <div id="memoryTitle"></div>

            <div id="memoryDate"></div>

            <div id="memoryDescription"></div>

        </div>


        <button
            id="nextButton"
            class="nav-button next"
            aria-label="Next"
        >
            ›
        </button>


        <!-- Replay button - only appears on last memory -->

        <button
            id="restartButton"
            aria-label="Replay"
        >
            ↻
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
