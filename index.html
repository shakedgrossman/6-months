<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>6 Months of Us</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500&family=Cormorant+Garamond:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- ==============================
         OPENING
    =============================== -->

    <section id="opening">

        <h1>6 months of us</h1>

        <button
            id="playButton"
            aria-label="Start"
        >
            ▶
        </button>

    </section>


    <!-- ==============================
         TIMELINE
    =============================== -->

    <main id="timeline">

        <!-- Previous -->

        <button
            id="previousButton"
            class="nav-button previous"
            aria-label="Previous"
        >
            ‹
        </button>


        <!-- Memory -->

        <div id="memory">

            <div id="mediaContainer">

                <img
                    id="memoryImage"
                    src=""
                    alt="Memory"
                >

                <video
                    id="memoryVideo"
                    playsinline
                    preload="metadata"
                ></video>

            </div>


            <div id="memoryInfo">

                <h2 id="memoryTitle"></h2>

                <div id="memoryDate"></div>

                <p id="memoryDescription"></p>

            </div>

        </div>


        <!-- Next -->

        <button
            id="nextButton"
            class="nav-button next"
            aria-label="Next"
        >
            ›
        </button>


        <!-- Restart -->

        <button
            id="restartButton"
            aria-label="Start again"
        >
            מההתחלה
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
