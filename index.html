<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>6 Months of Us</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- OPENING SCREEN -->

    <section id="opening" class="opening-screen">

        <div class="opening-content">

            <h1>6 months of us</h1>

            <button id="playButton" class="play-button" aria-label="Start">
                <span>▶</span>
            </button>

        </div>

    </section>


    <!-- TIMELINE -->

    <main id="timeline" class="timeline-screen">

        <!-- The horizontal timeline -->

        <div class="timeline-line"></div>


        <!-- Vertical branch connecting timeline to memory -->

        <div id="memoryBranch" class="memory-branch"></div>


        <!-- Point at the outer end of the branch -->

        <div id="memoryPoint" class="memory-point"></div>


        <!-- Current memory -->

        <div id="memory" class="memory">

            <img id="memoryImage" src="" alt="">

            <div class="memory-info">

                <div id="memoryDate" class="memory-date"></div>

                <h2 id="memoryTitle"></h2>

                <p id="memoryDescription"></p>

            </div>

        </div>


        <!-- Next button -->

        <button id="nextButton" class="next-button">

            <span class="next-arrow">→</span>

            <span class="next-label">NEXT</span>

        </button>

    </main>


    <!-- ENDING -->

    <section id="ending" class="ending-screen">

        <div class="ending-content">

            <h2>6 months down.</h2>

            <p>A lot more to go.</p>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
