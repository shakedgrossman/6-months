<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>6 Months of Us</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================
         OPENING
    ================================== -->

    <section
        id="opening"
        class="opening-screen"
    >

        <div class="opening-content">

            <h1>6 months of us</h1>

            <button
                id="playButton"
                class="play-button"
                aria-label="Start"
            >

                <span>▶</span>

            </button>

        </div>

    </section>



    <!-- =================================
         TIMELINE
    ================================== -->

    <main
        id="timeline"
        class="timeline-screen"
    >

        <!-- Vertical timeline line -->

        <div
            class="timeline-axis"
        ></div>


        <!-- Horizontal connector -->

        <div
            id="memoryConnector"
            class="memory-connector"
        ></div>


        <!-- Memory point -->

        <div
            id="memoryPoint"
            class="memory-point"
        ></div>


        <!-- Memory -->

        <div
            id="memory"
            class="memory"
        >

            <!--
                IMPORTANT:
                The JavaScript replaces this
                with a video automatically
                when necessary.
            -->

            <img
                id="memoryImage"
                class="memory-media"
                src=""
                alt=""
            >


            <div
                class="memory-info"
            >

                <div
                    id="memoryDate"
                    class="memory-date"
                ></div>


                <h2
                    id="memoryTitle"
                ></h2>


                <p
                    id="memoryDescription"
                ></p>

            </div>

        </div>



        <!-- =================================
             PREVIOUS
             UP
        ================================== -->

        <button
            id="previousButton"
            class="navigation-button previous-button"
            aria-label="Previous memory"
        >

            <span
                class="previous-arrow"
            ></span>

        </button>



        <!-- =================================
             NEXT
             DOWN
        ================================== -->

        <button
            id="nextButton"
            class="navigation-button next-button"
            aria-label="Next memory"
        >

            <span
                class="next-arrow"
            ></span>

        </button>

    </main>



    <!-- =================================
         ENDING
    ================================== -->

    <section
        id="ending"
        class="ending-screen"
    >

        <div
            class="ending-content"
        >

            <h2>6 months down.</h2>

            <p>A lot more to go.</p>


            <button
                id="replayButton"
                class="replay-button"
                aria-label="Replay"
            >

                ↻

            </button>

        </div>

    </section>



    <script src="script.js"></script>

</body>

</html>
